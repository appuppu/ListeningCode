# ListeningCode — Problem List
# Add problems here to generate content, audio, and diagrams.
#
# After adding problems, run: python3 scripts/generate_all.py
# Or wait for the cron job to pick them up automatically (every 30 min).

- category: arrays-and-hashing
  problems:
    - id: contains-duplicate
      title: "Finding Duplicates in an Array"
      description: "Given an integer array, determine if any value appears at least twice."
      difficulty: easy
      leetcode_url: "https://leetcode.com/problems/contains-duplicate/"
    - id: valid-anagram
      title: "Checking if Two Strings Are Anagrams"
      description: "Given two strings, determine if one is an anagram of the other by comparing character frequencies."
      difficulty: easy
      leetcode_url: "https://leetcode.com/problems/valid-anagram/"
    - id: two-sum
      title: "Finding Two Numbers That Add Up to a Target"
      description: "Given an array and a target sum, find the indices of two numbers that add up to the target."
      difficulty: easy
      leetcode_url: "https://leetcode.com/problems/two-sum/"
    - id: group-anagrams
      title: "Grouping Words by Anagram Patterns"
      description: "Given an array of strings, group the strings that are anagrams of each other."
      difficulty: medium
      leetcode_url: "https://leetcode.com/problems/group-anagrams/"
    - id: top-k-frequent-elements
      title: "Finding the K Most Frequent Elements"
      description: "Given an integer array and k, return the k most frequently occurring elements."
      difficulty: medium
      leetcode_url: "https://leetcode.com/problems/top-k-frequent-elements/"
    - id: encode-and-decode-strings
      title: "Encoding and Decoding a List of Strings"
      description: "Design an algorithm to encode a list of strings into a single string and decode it back."
      difficulty: medium
      leetcode_url: "https://leetcode.com/problems/encode-and-decode-strings/"
    - id: product-of-array-except-self
      title: "Computing Products Without Self Inclusion"
      description: "Given an array, return an array where each element is the product of all other elements except itself, without using division."
      difficulty: medium
      leetcode_url: "https://leetcode.com/problems/product-of-array-except-self/"
    - id: valid-sudoku
      title: "Validating a Sudoku Board"
      description: "Determine if a partially filled 9x9 Sudoku board is valid based on row, column, and box constraints."
      difficulty: medium
      leetcode_url: "https://leetcode.com/problems/valid-sudoku/"
    - id: longest-consecutive-sequence
      title: "Finding the Longest Consecutive Number Sequence"
      description: "Given an unsorted array, find the length of the longest sequence of consecutive integers."
      difficulty: medium
      leetcode_url: "https://leetcode.com/problems/longest-consecutive-sequence/"

- category: two-pointers
  problems:
    - id: valid-palindrome
      title: "Checking if a String is a Palindrome"
      description: "Determine if a string is a palindrome, considering only alphanumeric characters and ignoring case."
      difficulty: easy
      leetcode_url: "https://leetcode.com/problems/valid-palindrome/"
    - id: two-sum-ii
      title: "Finding Two Numbers in a Sorted Array That Add Up to a Target"
      description: "Given a sorted array and a target, find two numbers that add up to the target using their 1-indexed positions."
      difficulty: medium
      leetcode_url: "https://leetcode.com/problems/two-sum-ii-input-array-is-sorted/"
    - id: three-sum
      title: "Finding Three Numbers That Sum to Zero"
      description: "Given an array, find all unique triplets that sum to zero."
      difficulty: medium
      leetcode_url: "https://leetcode.com/problems/3sum/"
    - id: container-with-most-water
      title: "Maximizing Water Held Between Two Lines"
      description: "Given an array of heights, find two lines that together with the x-axis form a container holding the most water."
      difficulty: medium
      leetcode_url: "https://leetcode.com/problems/container-with-most-water/"
    - id: trapping-rain-water
      title: "Calculating Trapped Rainwater Between Bars"
      description: "Given an elevation map of bars, compute how much water can be trapped after raining."
      difficulty: hard
      leetcode_url: "https://leetcode.com/problems/trapping-rain-water/"

- category: sliding-window
  problems:
    - id: best-time-to-buy-and-sell-stock
      title: "Finding the Best Time to Buy and Sell a Stock"
      description: "Given daily stock prices, find the maximum profit from buying on one day and selling on a later day."
      difficulty: easy
      leetcode_url: "https://leetcode.com/problems/best-time-to-buy-and-sell-stock/"
    - id: longest-substring-without-repeating-characters
      title: "Finding the Longest Substring Without Repeating Characters"
      description: "Given a string, find the length of the longest substring that contains no duplicate characters."
      difficulty: medium
      leetcode_url: "https://leetcode.com/problems/longest-substring-without-repeating-characters/"
    - id: longest-repeating-character-replacement
      title: "Longest Substring After Replacing K Characters"
      description: "Given a string and k allowed replacements, find the length of the longest substring with all identical characters."
      difficulty: medium
      leetcode_url: "https://leetcode.com/problems/longest-repeating-character-replacement/"
    - id: permutation-in-string
      title: "Checking if a String Contains a Permutation of Another"
      description: "Given two strings, determine if one string contains any permutation of the other as a substring."
      difficulty: medium
      leetcode_url: "https://leetcode.com/problems/permutation-in-string/"
    - id: minimum-window-substring
      title: "Finding the Smallest Window Containing All Characters"
      description: "Given two strings, find the minimum window in the first string that contains all characters of the second string."
      difficulty: hard
      leetcode_url: "https://leetcode.com/problems/minimum-window-substring/"
    - id: sliding-window-maximum
      title: "Finding the Maximum in Each Sliding Window"
      description: "Given an array and a window size k, return the maximum value in each sliding window position."
      difficulty: hard
      leetcode_url: "https://leetcode.com/problems/sliding-window-maximum/"

